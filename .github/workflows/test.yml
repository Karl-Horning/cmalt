name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm test
      - name: Check favicons and OG images are up to date
        run: |
          npm run generate:favicons
          npm run generate:og-images
          if ! git diff --exit-code -- public/favicons public/og; then
            echo "::error::Favicons or OG images are out of date. Run 'npm run generate:favicons' and 'npm run generate:og-images' locally and commit the result."
            exit 1
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
